// GANTI SELURUH BAGIAN <script> DI AKHIR FILE DENGAN KODE BERIKUT:

<script>
// ==================== APPLICATION STATE ====================
const SYAFI = {
    // State management
    state: {
        currentPage: 'home',
        isAdmin: false,
        isLoggedIn: false,
        darkMode: localStorage.getItem('darkMode') === 'true',
        user: null,
        selectedBook: null,
        readingPage: 1,
        fontSize: 18,
        books: [],
        favorites: JSON.parse(localStorage.getItem('syafiFavorites')) || [],
        readingProgress: JSON.parse(localStorage.getItem('syafiReadingProgress')) || {},
        currentSearch: '',
        currentSort: 'newest',
        currentGenre: 'all',
        currentPageNumber: 1,
        booksPerPage: 12,
        categories: [
            { name: 'Fiksi', count: 0, icon: 'fas fa-book', color: 'bg-blue-500' },
            { name: 'Non-Fiksi', count: 0, icon: 'fas fa-scroll', color: 'bg-green-500' },
            { name: 'Sains', count: 0, icon: 'fas fa-flask', color: 'bg-purple-500' },
            { name: 'Sejarah', count: 0, icon: 'fas fa-landmark', color: 'bg-yellow-500' },
            { name: 'Teknologi', count: 0, icon: 'fas fa-laptop-code', color: 'bg-indigo-500' },
            { name: 'Bisnis', count: 0, icon: 'fas fa-chart-line', color: 'bg-red-500' },
            { name: 'Romance', count: 0, icon: 'fas fa-heart', color: 'bg-pink-500' },
            { name: 'Misteri', count: 0, icon: 'fas fa-search', color: 'bg-gray-500' },
            { name: 'Fantasi', count: 0, icon: 'fas fa-dragon', color: 'bg-teal-500' },
            { name: 'Biografi', count: 0, icon: 'fas fa-user', color: 'bg-orange-500' },
            { name: 'Pengembangan Diri', count: 0, icon: 'fas fa-brain', color: 'bg-cyan-500' },
            { name: 'Anak-anak', count: 0, icon: 'fas fa-child', color: 'bg-lime-500' }
        ],
        // Flag untuk mencegah render berulang
        isRendering: false,
        lastRenderTime: 0
    },
    
    // DOM Elements
    elements: {},
    
    // Initialize the application
    init: function() {
        console.log('SYAFI Reader Initializing...');
        this.loadBooksFromStorage();
        this.setupElements();
        this.setupEventListeners();
        this.applyDarkMode();
        this.checkLoginStatus();
        
        // Setup default books jika kosong
        if (this.state.books.length === 0) {
            this.setupDefaultBooks();
        }
        
        this.updateCategoryCounts();
        this.showPage('home');
        
        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loadingScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            }, 500);
        }, 800);
        
        console.log('SYAFI Reader Initialized with', this.state.books.length, 'books');
    },
    
    // Load books from localStorage or initialize with default books
    loadBooksFromStorage: function() {
        try {
            const storedBooks = localStorage.getItem('syafiBooks');
            if (storedBooks) {
                this.state.books = JSON.parse(storedBooks);
                console.log('Loaded', this.state.books.length, 'books from storage');
            }
        } catch (e) {
            console.error('Error loading books from storage:', e);
            this.state.books = [];
        }
    },
    
    // Save books to localStorage
    saveBooksToStorage: function() {
        try {
            localStorage.setItem('syafiBooks', JSON.stringify(this.state.books));
            this.updateCategoryCounts();
        } catch (e) {
            console.error('Error saving books to storage:', e);
        }
    },
    
    // Setup default books if no books exist
    setupDefaultBooks: function() {
        console.log('Setting up default books...');
        const defaultBooks = [
            {
                id: 1,
                title: "To Kill a Mockingbird",
                author: "Harper Lee",
                year: 1960,
                genre: "Fiksi",
                rating: 4.8,
                cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400&h=600&fit=crop",
                description: "Kisah mengharukan tentang ketidakadilan rasial dan masa kecil di Amerika Selatan.",
                totalPages: 324,
                pages: 20,
                content: this.generateBookContent("To Kill a Mockingbird", "Harper Lee"),
                downloads: 1250,
                isFeatured: true,
                createdAt: new Date('2025-01-15').getTime()
            },
            {
                id: 2,
                title: "1984",
                author: "George Orwell",
                year: 1949,
                genre: "Fiksi",
                rating: 4.7,
                cover: "https://images.unsplash.com/photo-1495640452863-552b17d4c78b?w=400&h=600&fit=crop",
                description: "Visi masa depan yang mengerikan di mana Partai mengontrol segala aspek kehidupan.",
                totalPages: 328,
                pages: 15,
                content: this.generateBookContent("1984", "George Orwell"),
                downloads: 980,
                isFeatured: true,
                createdAt: new Date('2025-02-10').getTime()
            },
            {
                id: 3,
                title: "Pride and Prejudice",
                author: "Jane Austen",
                year: 1813,
                genre: "Romance",
                rating: 4.6,
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&h=600&fit=crop",
                description: "Kisah cinta abadi antara Elizabeth Bennet dan Mr. Darcy di Inggris era Regency.",
                totalPages: 432,
                pages: 25,
                content: this.generateBookContent("Pride and Prejudice", "Jane Austen"),
                downloads: 1100,
                isFeatured: true,
                createdAt: new Date('2025-03-05').getTime()
            },
            {
                id: 4,
                title: "The Great Gatsby",
                author: "F. Scott Fitzgerald",
                year: 1925,
                genre: "Fiksi",
                rating: 4.5,
                cover: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&h=600&fit=crop",
                description: "Kisah tragis tentang kekayaan, cinta, dan Mimpi Amerika di era Jazz.",
                totalPages: 180,
                pages: 12,
                content: this.generateBookContent("The Great Gatsby", "F. Scott Fitzgerald"),
                downloads: 850,
                isFeatured: false,
                createdAt: new Date('2025-04-20').getTime()
            },
            {
                id: 5,
                title: "Sapiens: Riwayat Singkat Umat Manusia",
                author: "Yuval Noah Harari",
                year: 2011,
                genre: "Sejarah",
                rating: 4.8,
                cover: "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=400&h=600&fit=crop",
                description: "Perjalanan lengkap sejarah manusia dari zaman batu hingga revolusi teknologi.",
                totalPages: 443,
                pages: 30,
                content: this.generateBookContent("Sapiens", "Yuval Noah Harari"),
                downloads: 2100,
                isFeatured: true,
                createdAt: new Date('2025-05-12').getTime()
            }
        ];
        
        this.state.books = defaultBooks;
        this.saveBooksToStorage();
        console.log('Default books setup complete');
    },
    
    // Generate sample book content
    generateBookContent: function(title, author) {
        return [
            `Ini adalah buku berjudul "${title}" karya ${author}.`,
            `Buku ini adalah salah satu karya yang sangat berpengaruh dalam dunia sastra.`,
            `Bab pertama dimulai dengan pengenalan karakter utama dan latar tempat cerita.`,
            `Seiring berjalannya cerita, kita akan melihat perkembangan karakter dan konflik yang mereka hadapi.`,
            `Tema utama dari buku ini adalah tentang kehidupan, cinta, dan perjuangan manusia.`,
            `Pada bagian tengah buku, konflik mulai memuncak dan karakter dihadapkan pada pilihan-pilihan sulit.`,
            `Setiap bab membawa pembaca pada petualangan baru dan wawasan yang mendalam.`,
            `Gaya penulisan ${author} dikenal dengan deskripsi yang detail dan karakter yang berkembang.`,
            `Buku ini telah memenangkan berbagai penghargaan dan diakui secara internasional.`,
            `Pada bab akhir, semua cerita mulai menemukan penyelesaiannya.`
        ];
    },
    
    // Update category counts based on books
    updateCategoryCounts: function() {
        this.state.categories.forEach(category => {
            category.count = this.state.books.filter(book => book.genre === category.name).length;
        });
    },
    
    // Setup DOM elements
    setupElements: function() {
        this.elements = {
            themeToggle: document.getElementById('themeToggle'),
            sunIcon: document.getElementById('sunIcon'),
            moonIcon: document.getElementById('moonIcon'),
            adminLoginBtn: document.getElementById('adminLoginBtn'),
            logoutBtn: document.getElementById('logoutBtn'),
            loginModal: document.getElementById('loginModal'),
            closeLoginModal: document.getElementById('closeLoginModal'),
            loginForm: document.getElementById('loginForm'),
            loginError: document.getElementById('loginError'),
            registerModal: document.getElementById('registerModal'),
            closeRegisterModal: document.getElementById('closeRegisterModal'),
            registerForm: document.getElementById('registerForm'),
            registerError: document.getElementById('registerError'),
            registerSuccess: document.getElementById('registerSuccess'),
            showRegister: document.getElementById('showRegister'),
            showLogin: document.getElementById('showLogin'),
            adminNavBtn: document.getElementById('adminNavBtn'),
            statsNavBtn: document.getElementById('statsNavBtn'),
            searchInput: document.getElementById('searchInput'),
            mobileSearchInput: document.getElementById('mobileSearchInput'),
            clearSearch: document.getElementById('clearSearch'),
            clearMobileSearch: document.getElementById('clearMobileSearch'),
            userProfile: document.getElementById('userProfile'),
            username: document.getElementById('username'),
            userInitial: document.getElementById('userInitial'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            toastIcon: document.getElementById('toastIcon'),
            closeToast: document.getElementById('closeToast'),
            totalBooksCount: document.getElementById('totalBooksCount'),
            activeReadersCount: document.getElementById('activeReadersCount'),
            totalDownloadsCount: document.getElementById('totalDownloadsCount')
        };
    },
    
    // Setup event listeners - FIXED VERSION
    setupEventListeners: function() {
        // Theme toggle
        if (this.elements.themeToggle) {
            this.elements.themeToggle.addEventListener('click', () => this.toggleTheme());
        }
        
        // Navigation buttons
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                this.showPage(btn.dataset.page);
            });
        });
        
        // Admin login
        if (this.elements.adminLoginBtn) {
            this.elements.adminLoginBtn.addEventListener('click', (e) => {
                e.preventDefault();
                this.showModal('login');
            });
        }
        
        // Close login modal
        if (this.elements.closeLoginModal) {
            this.elements.closeLoginModal.addEventListener('click', () => this.hideModal('login'));
        }
        
        // Login form
        if (this.elements.loginForm) {
            this.elements.loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                this.handleLogin(e);
            });
        }
        
        // Register form
        if (this.elements.registerForm) {
            this.elements.registerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                this.handleRegister(e);
            });
        }
        
        // Show register modal
        if (this.elements.showRegister) {
            this.elements.showRegister.addEventListener('click', (e) => {
                e.preventDefault();
                this.hideModal('login');
                setTimeout(() => this.showModal('register'), 100);
            });
        }
        
        // Show login modal
        if (this.elements.showLogin) {
            this.elements.showLogin.addEventListener('click', (e) => {
                e.preventDefault();
                this.hideModal('register');
                setTimeout(() => this.showModal('login'), 100);
            });
        }
        
        // Close register modal
        if (this.elements.closeRegisterModal) {
            this.elements.closeRegisterModal.addEventListener('click', () => this.hideModal('register'));
        }
        
        // Logout
        if (this.elements.logoutBtn) {
            this.elements.logoutBtn.addEventListener('click', () => this.handleLogout());
        }
        
        // Search - dengan debounce untuk menghindari render berulang
        const handleSearchDebounced = this.debounce((value) => {
            this.handleSearch(value);
        }, 300);
        
        if (this.elements.searchInput) {
            this.elements.searchInput.addEventListener('input', (e) => {
                handleSearchDebounced(e.target.value);
            });
        }
        
        if (this.elements.mobileSearchInput) {
            this.elements.mobileSearchInput.addEventListener('input', (e) => {
                handleSearchDebounced(e.target.value);
            });
        }
        
        // Clear search
        if (this.elements.clearSearch) {
            this.elements.clearSearch.addEventListener('click', () => this.clearSearch());
        }
        
        if (this.elements.clearMobileSearch) {
            this.elements.clearMobileSearch.addEventListener('click', () => this.clearSearch());
        }
        
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        if (togglePassword) {
            togglePassword.addEventListener('click', () => this.togglePasswordVisibility('loginPassword', 'eyeIcon', 'eyeOffIcon'));
        }
        
        const toggleRegisterPassword = document.getElementById('toggleRegisterPassword');
        if (toggleRegisterPassword) {
            toggleRegisterPassword.addEventListener('click', () => this.togglePasswordVisibility('registerPassword', 'registerEyeIcon', 'registerEyeOffIcon'));
        }
        
        const toggleRegisterConfirmPassword = document.getElementById('toggleRegisterConfirmPassword');
        if (toggleRegisterConfirmPassword) {
            toggleRegisterConfirmPassword.addEventListener('click', () => this.togglePasswordVisibility('registerConfirmPassword', 'registerConfirmEyeIcon', 'registerConfirmEyeOffIcon'));
        }
        
        // Close toast
        if (this.elements.closeToast) {
            this.elements.closeToast.addEventListener('click', () => this.hideToast());
        }
        
        // Close modals on outside click
        document.addEventListener('click', (e) => {
            if (e.target === this.elements.loginModal) {
                this.hideModal('login');
            }
            if (e.target === this.elements.registerModal) {
                this.hideModal('register');
            }
            if (e.target === document.getElementById('bookDetailModal')) {
                this.hideModal('bookDetail');
            }
            if (e.target === document.getElementById('addBookModal')) {
                this.hideModal('addBook');
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                this.hideModal('login');
                this.hideModal('register');
                this.hideModal('bookDetail');
                this.hideModal('addBook');
            }
        });
        
        console.log('Event listeners setup complete');
    },
    
    // Debounce function untuk mencegah terlalu banyak render
    debounce: function(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    },
    
    // Apply dark mode based on saved preference
    applyDarkMode: function() {
        if (this.state.darkMode) {
            document.body.classList.add('dark');
            if (this.elements.sunIcon) this.elements.sunIcon.classList.add('hidden');
            if (this.elements.moonIcon) this.elements.moonIcon.classList.remove('hidden');
        } else {
            document.body.classList.remove('dark');
            if (this.elements.sunIcon) this.elements.sunIcon.classList.remove('hidden');
            if (this.elements.moonIcon) this.elements.moonIcon.classList.add('hidden');
        }
    },
    
    // Toggle theme
    toggleTheme: function() {
        this.state.darkMode = !this.state.darkMode;
        localStorage.setItem('darkMode', this.state.darkMode);
        this.applyDarkMode();
        this.showToast(`Mode ${this.state.darkMode ? 'gelap' : 'terang'} diaktifkan`, 'success');
    },
    
    // Check login status
    checkLoginStatus: function() {
        try {
            const user = localStorage.getItem('syafiUser');
            if (user) {
                this.state.user = JSON.parse(user);
                this.state.isLoggedIn = true;
                this.state.isAdmin = this.state.user.role === 'admin';
                this.updateUserUI();
            }
        } catch (e) {
            console.error('Error checking login status:', e);
        }
    },
    
    // Update user UI
    updateUserUI: function() {
        if (this.state.isLoggedIn && this.state.user) {
            if (this.elements.adminLoginBtn) this.elements.adminLoginBtn.classList.add('hidden');
            if (this.elements.logoutBtn) this.elements.logoutBtn.classList.remove('hidden');
            if (this.elements.userProfile) this.elements.userProfile.classList.remove('hidden');
            if (this.elements.username) this.elements.username.textContent = this.state.user.name;
            if (this.elements.userInitial) this.elements.userInitial.textContent = this.state.user.name.charAt(0).toUpperCase();
            
            if (this.state.isAdmin) {
                if (this.elements.adminNavBtn) this.elements.adminNavBtn.classList.remove('hidden');
                if (this.elements.statsNavBtn) this.elements.statsNavBtn.classList.remove('hidden');
            }
        } else {
            if (this.elements.adminLoginBtn) this.elements.adminLoginBtn.classList.remove('hidden');
            if (this.elements.logoutBtn) this.elements.logoutBtn.classList.add('hidden');
            if (this.elements.userProfile) this.elements.userProfile.classList.add('hidden');
            if (this.elements.adminNavBtn) this.elements.adminNavBtn.classList.add('hidden');
            if (this.elements.statsNavBtn) this.elements.statsNavBtn.classList.add('hidden');
        }
    },
    
    // Show page - FIXED: Mencegah render berulang
    showPage: function(page) {
        // Cegah render berulang untuk halaman yang sama
        if (this.state.currentPage === page && this.state.isRendering) {
            return;
        }
        
        this.state.currentPage = page;
        this.state.isRendering = true;
        
        // Update active nav button
        document.querySelectorAll('.page-btn').forEach(btn => {
            if (btn.dataset.page === page) {
                btn.classList.add('border-b-2', 'border-blue-500', 'text-blue-500', 'dark:text-blue-400');
                btn.classList.remove('hover:text-blue-500', 'dark:hover:text-blue-400');
            } else {
                btn.classList.remove('border-b-2', 'border-blue-500', 'text-blue-500', 'dark:text-blue-400');
                btn.classList.add('hover:text-blue-500', 'dark:hover:text-blue-400');
            }
        });
        
        // Show/hide pages
        document.querySelectorAll('#mainContent > div').forEach(div => {
            div.classList.add('hidden');
        });
        
        const pageElement = document.getElementById(page + 'Page');
        if (pageElement) {
            pageElement.classList.remove('hidden');
        }
        
        // Load page content
        switch(page) {
            case 'home':
                this.renderHomePage();
                break;
            case 'library':
                this.renderLibraryPage();
                break;
            case 'categories':
                this.renderCategoriesPage();
                break;
            case 'favorites':
                this.renderFavoritesPage();
                break;
            case 'admin':
                this.renderAdminPage();
                break;
            case 'stats':
                this.renderStatsPage();
                break;
        }
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Reset rendering flag setelah delay
        setTimeout(() => {
            this.state.isRendering = false;
        }, 100);
    },
    
    // Render home page - FIXED: Menghindari infinite loop
    renderHomePage: function() {
        console.log('Rendering home page...');
        
        // Update stats
        const totalDownloads = this.state.books.reduce((sum, book) => sum + (book.downloads || 0), 0);
        const activeReaders = Math.floor(totalDownloads * 0.3) + 150;
        
        if (this.elements.totalBooksCount) this.elements.totalBooksCount.textContent = this.state.books.length;
        if (this.elements.activeReadersCount) this.elements.activeReadersCount.textContent = activeReaders.toLocaleString();
        if (this.elements.totalDownloadsCount) this.elements.totalDownloadsCount.textContent = totalDownloads.toLocaleString();
        
        // Render featured books
        const featuredBooks = this.state.books.filter(book => book.isFeatured).slice(0, 5);
        this.renderBooks(featuredBooks, 'featuredBooksContainer');
        
        // Render categories
        this.renderCategories();
        
        // Render recent books
        const recentBooks = [...this.state.books]
            .sort((a, b) => b.createdAt - a.createdAt)
            .slice(0, 8);
        this.renderBooks(recentBooks, 'recentBooksContainer');
    },
    
    // Render library page
    renderLibraryPage: function() {
        console.log('Rendering library page...');
        
        // Setup filter listeners hanya sekali
        this.setupFilterListeners();
        
        const filteredBooks = this.getFilteredBooks();
        const totalPages = Math.ceil(filteredBooks.length / this.state.booksPerPage);
        
        // Show/hide no books message
        const noBooksMessage = document.getElementById('noBooksMessage');
        if (filteredBooks.length === 0) {
            if (noBooksMessage) noBooksMessage.classList.remove('hidden');
            const container = document.getElementById('allBooksContainer');
            if (container) container.innerHTML = '';
            const pagination = document.getElementById('paginationContainer');
            if (pagination) pagination.classList.add('hidden');
            return;
        } else {
            if (noBooksMessage) noBooksMessage.classList.add('hidden');
        }
        
        // Calculate pagination
        const startIndex = (this.state.currentPageNumber - 1) * this.state.booksPerPage;
        const endIndex = startIndex + this.state.booksPerPage;
        const paginatedBooks = filteredBooks.slice(startIndex, endIndex);
        
        // Render books
        this.renderBooks(paginatedBooks, 'allBooksContainer');
        
        // Render pagination
        this.renderPagination(totalPages);
        
        // Update genre filter options
        this.updateGenreFilter();
    },
    
    // Setup filter listeners hanya sekali
    setupFilterListeners: function() {
        // Cek apakah listeners sudah ditambahkan
        if (this.state.filterListenersAdded) return;
        
        const sortFilter = document.getElementById('sortFilter');
        const genreFilter = document.getElementById('genreFilter');
        
        if (sortFilter && !sortFilter.hasAttribute('data-listener-added')) {
            sortFilter.setAttribute('data-listener-added', 'true');
            sortFilter.addEventListener('change', (e) => {
                this.state.currentSort = e.target.value;
                this.state.currentPageNumber = 1;
                this.renderLibraryPage();
            });
        }
        
        if (genreFilter && !genreFilter.hasAttribute('data-listener-added')) {
            genreFilter.setAttribute('data-listener-added', 'true');
            genreFilter.addEventListener('change', (e) => {
                this.state.currentGenre = e.target.value;
                this.state.currentPageNumber = 1;
                this.renderLibraryPage();
            });
        }
        
        this.state.filterListenersAdded = true;
    },
    
    // Get filtered books
    getFilteredBooks: function() {
        let filtered = [...this.state.books];
        
        // Apply search
        if (this.state.currentSearch) {
            const searchTerm = this.state.currentSearch.toLowerCase();
            filtered = filtered.filter(book => 
                book.title.toLowerCase().includes(searchTerm) ||
                book.author.toLowerCase().includes(searchTerm) ||
                book.genre.toLowerCase().includes(searchTerm)
            );
        }
        
        // Apply genre filter
        if (this.state.currentGenre !== 'all') {
            filtered = filtered.filter(book => book.genre === this.state.currentGenre);
        }
        
        // Apply sort
        switch(this.state.currentSort) {
            case 'newest':
                filtered.sort((a, b) => b.createdAt - a.createdAt);
                break;
            case 'oldest':
                filtered.sort((a, b) => a.createdAt - b.createdAt);
                break;
            case 'title-asc':
                filtered.sort((a, b) => a.title.localeCompare(b.title));
                break;
            case 'title-desc':
                filtered.sort((a, b) => b.title.localeCompare(a.title));
                break;
            case 'rating':
                filtered.sort((a, b) => b.rating - a.rating);
                break;
        }
        
        return filtered;
    },
    
    // Render pagination
    renderPagination: function(totalPages) {
        const paginationContainer = document.getElementById('paginationContainer');
        const pageNumbersContainer = document.getElementById('pageNumbers');
        
        if (!paginationContainer || !pageNumbersContainer) return;
        
        if (totalPages <= 1) {
            paginationContainer.classList.add('hidden');
            return;
        }
        
        paginationContainer.classList.remove('hidden');
        
        // Update prev/next buttons
        const prevBtn = document.getElementById('prevPageBtn');
        const nextBtn = document.getElementById('nextPageBtn');
        
        if (prevBtn) {
            prevBtn.disabled = this.state.currentPageNumber === 1;
            // Hapus event listener lama dan tambahkan yang baru
            prevBtn.replaceWith(prevBtn.cloneNode(true));
            const newPrevBtn = document.getElementById('prevPageBtn');
            newPrevBtn.addEventListener('click', () => {
                if (this.state.currentPageNumber > 1) {
                    this.state.currentPageNumber--;
                    this.renderLibraryPage();
                }
            });
        }
        
        if (nextBtn) {
            nextBtn.disabled = this.state.currentPageNumber === totalPages;
            // Hapus event listener lama dan tambahkan yang baru
            nextBtn.replaceWith(nextBtn.cloneNode(true));
            const newNextBtn = document.getElementById('nextPageBtn');
            newNextBtn.addEventListener('click', () => {
                if (this.state.currentPageNumber < totalPages) {
                    this.state.currentPageNumber++;
                    this.renderLibraryPage();
                }
            });
        }
        
        // Generate page numbers
        let pageNumbers = [];
        const current = this.state.currentPageNumber;
        
        if (totalPages <= 5) {
            for (let i = 1; i <= totalPages; i++) {
                pageNumbers.push(i);
            }
        } else {
            if (current <= 3) {
                pageNumbers = [1, 2, 3, 4, '...', totalPages];
            } else if (current >= totalPages - 2) {
                pageNumbers = [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
            } else {
                pageNumbers = [1, '...', current - 1, current, current + 1, '...', totalPages];
            }
        }
        
        // Render page numbers
        pageNumbersContainer.innerHTML = '';
        pageNumbers.forEach(page => {
            if (page === '...') {
                pageNumbersContainer.innerHTML += `<span class="px-3 py-1">...</span>`;
            } else {
                const isActive = page === this.state.currentPageNumber;
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-number px-3 py-1 rounded-lg ${isActive ? 'bg-blue-600 text-white' : 'border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800'}`;
                pageBtn.textContent = page;
                pageBtn.dataset.page = page;
                pageBtn.addEventListener('click', () => {
                    this.state.currentPageNumber = parseInt(page);
                    this.renderLibraryPage();
                });
                pageNumbersContainer.appendChild(pageBtn);
            }
        });
    },
    
    // Update genre filter options
    updateGenreFilter: function() {
        const genreFilter = document.getElementById('genreFilter');
        if (!genreFilter) return;
        
        // Get unique genres from books
        const genres = ['all', ...new Set(this.state.books.map(book => book.genre))];
        
        // Update options
        genreFilter.innerHTML = genres.map(genre => 
            `<option value="${genre}" ${genre === this.state.currentGenre ? 'selected' : ''}>${genre === 'all' ? 'Semua Genre' : genre}</option>`
        ).join('');
    },
    
    // Render categories
    renderCategories: function() {
        const container = document.getElementById('categoriesContainer');
        if (!container) return;
        
        // Get top 6 categories by count
        const topCategories = [...this.state.categories]
            .filter(cat => cat.count > 0)
            .sort((a, b) => b.count - a.count)
            .slice(0, 6);
        
        container.innerHTML = topCategories.map(category => `
            <button onclick="SYAFI.showCategoryPage('${category.name}')" 
                    class="flex flex-col items-center justify-center p-4 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-700 hover:shadow-md transition-all">
                <div class="w-14 h-14 rounded-full ${category.color} flex items-center justify-center mb-3">
                    <i class="${category.icon} text-white text-xl"></i>
                </div>
                <h3 class="font-semibold">${category.name}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">${category.count} buku</p>
            </button>
        `).join('');
    },
    
    // Show category page
    showCategoryPage: function(categoryName) {
        this.showPage('categories');
        
        // Update UI to show category books
        const categoryTitle = document.getElementById('categoryTitle');
        const categoryBooksSection = document.getElementById('categoryBooksSection');
        
        if (categoryTitle) categoryTitle.textContent = `Buku dalam kategori: ${categoryName}`;
        if (categoryBooksSection) categoryBooksSection.classList.remove('hidden');
        
        // Filter books by category
        const categoryBooks = this.state.books.filter(book => book.genre === categoryName);
        this.renderBooks(categoryBooks, 'categoryBooksContainer');
    },
    
    // Render books to a container
    renderBooks: function(books, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        if (books.length === 0) {
            container.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <i class="fas fa-search text-5xl text-gray-400 mb-4"></i>
                    <h3 class="text-xl font-semibold mb-2">Tidak ada buku yang ditemukan</h3>
                    <p class="text-gray-500 mb-6">Coba ubah kata kunci pencarian atau filter yang digunakan</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = books.map(book => this.getBookCardHTML(book)).join('');
    },
    
    // Get book card HTML
    getBookCardHTML: function(book, showRemove = false) {
        const isFavorite = this.state.favorites.includes(book.id);
        const progress = this.state.readingProgress[book.id] || 0;
        
        return `
            <div class="rounded-xl overflow-hidden shadow-lg hover:shadow-xl transition-all bg-white dark:bg-gray-800 animate-slideIn">
                <div class="relative">
                    <img src="${book.cover}" alt="${book.title}" class="w-full h-64 object-cover" loading="lazy">
                    <div class="absolute top-2 right-2 bg-black bg-opacity-70 text-white px-2 py-1 rounded">
                        ${book.rating} <i class="fas fa-star text-yellow-400"></i>
                    </div>
                    <div class="absolute top-2 left-2">
                        <button onclick="SYAFI.toggleFavorite(${book.id})" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 flex items-center justify-center shadow-md hover:scale-110 transition-transform">
                            <i class="fas fa-heart ${isFavorite ? 'text-red-500' : 'text-gray-400'}"></i>
                        </button>
                    </div>
                    ${progress > 0 ? `
                        <div class="absolute bottom-0 left-0 right-0 bg-gray-200 dark:bg-gray-700 h-1">
                            <div class="bg-green-500 h-full" style="width: ${progress}%"></div>
                        </div>
                    ` : ''}
                </div>
                
                <div class="p-4">
                    <h3 class="font-bold text-lg mb-1 line-clamp-1">${book.title}</h3>
                    <p class="text-sm mb-2 text-gray-600 dark:text-gray-300">
                        ${book.author} • ${book.year}
                    </p>
                    <div class="flex items-center justify-between mb-3">
                        <span class="px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">
                            ${book.genre}
                        </span>
                        <span class="text-sm">${book.totalPages} hlm</span>
                    </div>
                    
                    <p class="text-sm mb-4 line-clamp-2">
                        ${book.description}
                    </p>
                    
                    <div class="flex gap-2">
                        <button onclick="SYAFI.openBookDetail(${book.id})" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-2.5 rounded-lg font-semibold hover:opacity-90 flex items-center justify-center gap-2">
                            <i class="fas fa-book-open"></i> Baca
                        </button>
                        <button onclick="SYAFI.downloadBook(${book.id})" class="p-2.5 border rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Download">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;
    },
    
    // Open book detail
    openBookDetail: function(bookId) {
        const book = this.state.books.find(b => b.id === bookId);
        if (!book) return;
        
        const isFavorite = this.state.favorites.includes(bookId);
        
        const modal = document.getElementById('bookDetailModal');
        modal.innerHTML = `
            <div class="animate-fadeIn">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-2xl font-bold">${book.title}</h2>
                        <p class="text-gray-600 dark:text-gray-400">${book.author} • ${book.year}</p>
                    </div>
                    <button onclick="SYAFI.hideModal('bookDetail')" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <div class="flex flex-col md:flex-row gap-8 mb-8">
                    <div class="md:w-1/3">
                        <div class="sticky top-0">
                            <img src="${book.cover}" alt="${book.title}" class="w-full h-auto rounded-xl shadow-lg mb-4">
                            <div class="flex gap-2 mb-4">
                                <span class="px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">
                                    ${book.genre}
                                </span>
                                <span class="px-3 py-1 rounded-full text-sm bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200">
                                    ${book.rating} <i class="fas fa-star"></i>
                                </span>
                            </div>
                            
                            <div class="space-y-3">
                                <div class="flex justify-between">
                                    <span class="text-gray-600 dark:text-gray-400">Halaman:</span>
                                    <span class="font-medium">${book.totalPages}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600 dark:text-gray-400">Download:</span>
                                    <span class="font-medium">${book.downloads || 0}</span>
                                </div>
                            </div>
                            
                            <div class="mt-6">
                                <button onclick="SYAFI.openReader(${book.id})" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 mb-3 flex items-center justify-center gap-2">
                                    <i class="fas fa-book-open"></i> Baca Sekarang
                                </button>
                                <button onclick="SYAFI.downloadBook(${book.id})" class="w-full bg-green-500 text-white py-3 rounded-lg font-semibold hover:bg-green-600 mb-3 flex items-center justify-center gap-2">
                                    <i class="fas fa-download"></i> Download
                                </button>
                                <button onclick="SYAFI.toggleFavorite(${book.id})" class="w-full ${isFavorite ? 'bg-red-500' : 'bg-gray-200 dark:bg-gray-700'} text-${isFavorite ? 'white' : 'gray-700 dark:text-gray-300'} py-3 rounded-lg font-semibold hover:opacity-90 flex items-center justify-center gap-2">
                                    <i class="fas fa-heart ${isFavorite ? 'text-white' : 'text-gray-600 dark:text-gray-400'}"></i> ${isFavorite ? 'Hapus dari Favorit' : 'Tambahkan ke Favorit'}
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="md:w-2/3">
                        <div class="mb-6">
                            <h3 class="font-bold text-lg mb-3">Deskripsi</h3>
                            <p class="text-gray-700 dark:text-gray-300 leading-relaxed">${book.description}</p>
                        </div>
                        
                        <div class="mb-6">
                            <h3 class="font-bold text-lg mb-3">Preview</h3>
                            <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-lg max-h-60 overflow-y-auto">
                                <p class="reading-font text-gray-700 dark:text-gray-300">${book.content[0]}</p>
                                <p class="reading-font text-gray-700 dark:text-gray-300 mt-3">${book.content[1] || ''}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        this.showModal('bookDetail');
    },
    
    // Open reader
    openReader: function(bookId) {
        const book = this.state.books.find(b => b.id === bookId);
        if (!book) return;
        
        this.state.selectedBook = book;
        this.state.readingPage = 1;
        
        // Calculate current reading page based on progress
        const progress = this.state.readingProgress[bookId] || 0;
        if (progress > 0) {
            this.state.readingPage = Math.max(1, Math.floor((progress / 100) * book.content.length));
        }
        
        const readerPage = document.getElementById('readerPage');
        readerPage.classList.remove('hidden');
        readerPage.innerHTML = `
            <div class="animate-fadeIn">
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="SYAFI.closeReader()" class="flex items-center gap-2 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">
                            <i class="fas fa-arrow-left"></i> Kembali
                        </button>
                        
                        <div class="flex items-center gap-4">
                            <div class="hidden md:flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full">
                                <button onclick="SYAFI.changeFontSize(-1)" class="p-1 hover:text-blue-600">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="w-12 text-center">${this.state.fontSize}px</span>
                                <button onclick="SYAFI.changeFontSize(1)" class="p-1 hover:text-blue-600">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            
                            <button onclick="SYAFI.toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                                <i class="fas ${this.state.darkMode ? 'fa-sun text-yellow-500' : 'fa-moon text-indigo-400'}"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-center mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold mb-2">${book.title}</h1>
                        <p class="text-gray-600 dark:text-gray-400">${book.author} • Halaman ${this.state.readingPage} dari ${book.content.length}</p>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 md:p-10 min-h-[60vh] shadow-lg mb-8">
                    <div id="readerContent" class="reading-font mx-auto max-w-3xl" style="font-size: ${this.state.fontSize}px;">
                        ${book.content[this.state.readingPage - 1]}
                    </div>
                </div>
                
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-lg">
                    <button onclick="SYAFI.changePage(-1)" class="flex items-center gap-2 px-6 py-3 rounded-full border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" ${this.state.readingPage <= 1 ? 'disabled' : ''}>
                        <i class="fas fa-chevron-left"></i> Sebelumnya
                    </button>
                    
                    <div class="flex flex-col items-center gap-2">
                        <div class="flex items-center gap-4">
                            <input type="range" min="1" max="${book.content.length}" value="${this.state.readingPage}" 
                                oninput="SYAFI.goToPage(this.value)" class="w-48 md:w-64">
                            <span class="font-medium">${this.state.readingPage} / ${book.content.length}</span>
                        </div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">
                            ${Math.round((this.state.readingPage / book.content.length) * 100)}% selesai
                        </div>
                    </div>
                    
                    <button onclick="SYAFI.changePage(1)" class="flex items-center gap-2 px-6 py-3 rounded-full border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" ${this.state.readingPage >= book.content.length ? 'disabled' : ''}>
                        Berikutnya <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        `;
        
        // Hide other pages
        document.querySelectorAll('#mainContent > div').forEach(div => {
            if (div.id !== 'readerPage') {
                div.classList.add('hidden');
            }
        });
        
        // Update reading progress
        this.updateReadingProgress(bookId);
    },
    
    // Close reader
    closeReader: function() {
        this.showPage('home');
    },
    
    // Change font size in reader
    changeFontSize: function(delta) {
        this.state.fontSize = Math.max(14, Math.min(28, this.state.fontSize + delta));
        const readerContent = document.getElementById('readerContent');
        if (readerContent) {
            readerContent.style.fontSize = this.state.fontSize + 'px';
        }
    },
    
    // Change page in reader
    changePage: function(delta) {
        if (!this.state.selectedBook) return;
        
        const newPage = this.state.readingPage + delta;
        if (newPage < 1 || newPage > this.state.selectedBook.content.length) return;
        
        this.state.readingPage = newPage;
        this.updateReaderContent();
        this.updateReadingProgress(this.state.selectedBook.id);
    },
    
    // Go to specific page
    goToPage: function(page) {
        if (!this.state.selectedBook) return;
        
        page = parseInt(page);
        if (page < 1 || page > this.state.selectedBook.content.length) return;
        
        this.state.readingPage = page;
        this.updateReaderContent();
        this.updateReadingProgress(this.state.selectedBook.id);
    },
    
    // Update reader content
    updateReaderContent: function() {
        if (!this.state.selectedBook) return;
        
        const readerContent = document.getElementById('readerContent');
        const pageInfo = document.querySelector('#readerPage p.text-gray-600');
        const rangeInput = document.querySelector('#readerPage input[type="range"]');
        const prevBtn = document.querySelector('#readerPage button:nth-child(1)');
        const nextBtn = document.querySelector('#readerPage button:last-child');
        
        if (readerContent) {
            readerContent.textContent = this.state.selectedBook.content[this.state.readingPage - 1];
        }
        if (pageInfo) {
            pageInfo.textContent = `${this.state.selectedBook.author} • Halaman ${this.state.readingPage} dari ${this.state.selectedBook.content.length}`;
        }
        if (rangeInput) {
            rangeInput.value = this.state.readingPage;
        }
        if (prevBtn) {
            prevBtn.disabled = this.state.readingPage <= 1;
        }
        if (nextBtn) {
            nextBtn.disabled = this.state.readingPage >= this.state.selectedBook.content.length;
        }
    },
    
    // Update reading progress
    updateReadingProgress: function(bookId) {
        if (!this.state.selectedBook) return;
        
        const progress = Math.round((this.state.readingPage / this.state.selectedBook.content.length) * 100);
        this.state.readingProgress[bookId] = progress;
        localStorage.setItem('syafiReadingProgress', JSON.stringify(this.state.readingProgress));
    },
    
    // Download book
    downloadBook: function(bookId) {
        const book = this.state.books.find(b => b.id === bookId);
        if (!book) return;
        
        // Increment download count
        book.downloads = (book.downloads || 0) + 1;
        this.saveBooksToStorage();
        
        const content = `
${book.title}
Oleh: ${book.author}
Tahun: ${book.year}
Genre: ${book.genre}
Rating: ${book.rating}/5

${book.description}

=====================================

${book.content.map((paragraph, index) => `
Halaman ${index + 1}

${paragraph}
`).join('\n\n')}

=====================================
Downloaded from SYAFI Reader
© ${new Date().getFullYear()} SYAFI Reader
        `;
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${book.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        this.showToast(`Buku "${book.title}" berhasil diunduh!`, 'success');
        
        // Update stats on home page
        if (this.state.currentPage === 'home') {
            this.renderHomePage();
        }
    },
    
    // Toggle favorite
    toggleFavorite: function(bookId) {
        const index = this.state.favorites.indexOf(bookId);
        
        if (index === -1) {
            this.state.favorites.push(bookId);
            this.showToast('Buku ditambahkan ke favorit', 'success');
        } else {
            this.state.favorites.splice(index, 1);
            this.showToast('Buku dihapus dari favorit', 'info');
        }
        
        localStorage.setItem('syafiFavorites', JSON.stringify(this.state.favorites));
        
        // Update UI if on favorites page
        if (this.state.currentPage === 'favorites') {
            this.renderFavoritesPage();
        }
        
        // Update book card heart icon
        const heartIcons = document.querySelectorAll(`button[onclick*="toggleFavorite(${bookId})"] i.fa-heart`);
        heartIcons.forEach(icon => {
            if (index === -1) {
                icon.classList.remove('text-gray-400');
                icon.classList.add('text-red-500');
            } else {
                icon.classList.remove('text-red-500');
                icon.classList.add('text-gray-400');
            }
        });
    },
    
    // Show modal
    showModal: function(modalName) {
        const modal = document.getElementById(modalName + 'Modal');
        if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
    },
    
    // Hide modal
    hideModal: function(modalName) {
        const modal = document.getElementById(modalName + 'Modal');
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    },
    
    // Toggle password visibility
    togglePasswordVisibility: function(inputId, eyeIconId, eyeOffIconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(eyeIconId);
        const eyeOffIcon = document.getElementById(eyeOffIconId);
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.add('hidden');
            eyeOffIcon.classList.remove('hidden');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('hidden');
            eyeOffIcon.classList.add('hidden');
        }
    },
    
    // Handle search
    handleSearch: function(searchTerm) {
        this.state.currentSearch = searchTerm;
        this.state.currentPageNumber = 1;
        
        // Show/hide clear button
        const showClear = searchTerm.length > 0;
        if (this.elements.clearSearch) this.elements.clearSearch.classList.toggle('hidden', !showClear);
        if (this.elements.clearMobileSearch) this.elements.clearMobileSearch.classList.toggle('hidden', !showClear);
        
        // If on library page, update results
        if (this.state.currentPage === 'library') {
            this.renderLibraryPage();
        }
    },
    
    // Clear search
    clearSearch: function() {
        this.state.currentSearch = '';
        if (this.elements.searchInput) this.elements.searchInput.value = '';
        if (this.elements.mobileSearchInput) this.elements.mobileSearchInput.value = '';
        if (this.elements.clearSearch) this.elements.clearSearch.classList.add('hidden');
        if (this.elements.clearMobileSearch) this.elements.clearMobileSearch.classList.add('hidden');
        
        if (this.state.currentPage === 'library') {
            this.renderLibraryPage();
        }
    },
    
    // Show toast notification
    showToast: function(message, type = 'success') {
        const toast = this.elements.toast;
        const toastMessage = this.elements.toastMessage;
        const toastIcon = this.elements.toastIcon;
        
        if (!toast || !toastMessage || !toastIcon) return;
        
        // Set message and icon
        toastMessage.textContent = message;
        
        switch(type) {
            case 'success':
                toastIcon.className = 'fas fa-check-circle text-green-400';
                break;
            case 'error':
                toastIcon.className = 'fas fa-exclamation-circle text-red-400';
                break;
            case 'info':
                toastIcon.className = 'fas fa-info-circle text-blue-400';
                break;
            case 'warning':
                toastIcon.className = 'fas fa-exclamation-triangle text-yellow-400';
                break;
        }
        
        // Show toast
        toast.classList.remove('translate-x-full');
        
        // Auto hide after 3 seconds
        setTimeout(() => {
            this.hideToast();
        }, 3000);
    },
    
    // Hide toast
    hideToast: function() {
        const toast = this.elements.toast;
        if (toast) {
            toast.classList.add('translate-x-full');
        }
    }
};

// Initialize the app when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    SYAFI.init();
});

// Make SYAFI available globally
window.SYAFI = SYAFI;
</script>
